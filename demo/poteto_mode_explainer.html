<script>
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const node=(top,text,cl='')=>`<div class="node fade ${cl}"><small>${top}</small>${text}</div>`;
const cards=s=>`<div class="cards">${s.cards.map(c=>`<div class="card fade"><div class="tag">${escapeHtml(c.label)}</div><h3>${escapeHtml(c.title)}</h3><p>${escapeHtml(c.body)}</p></div>`).join('')}</div>`;
window.showScene=(s,index,total)=>{
 document.getElementById('header').innerHTML=`<div class="kicker fade">${escapeHtml(s.chapter)}</div><h1 class="title fade">${escapeHtml(s.title)}</h1><p class="subtitle fade">${escapeHtml(s.subtitle)}</p>`;
 document.getElementById('takeaway').textContent=s.takeaway;document.getElementById('count').textContent=String(index+1).padStart(2,'0')+' / '+String(total).padStart(2,'0');document.getElementById('progress').style.width=((index+1)/total*100)+'%';
 let h='';
 if(s.kind==='hero')h=`<div class="hero-title fade">From <span class="outline">intent</span><br>to evidence.</div><div class="orbit"><div class="orb a">?</div><div class="orb b">◇</div><div class="orb c">✓</div></div><div class="core fade">pstack</div>`;
 else if(s.kind==='file')h=`<div class="filebox fade"><div class="filebar"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span>poteto-mode / SKILL.md</span></div><pre><span class="mint">name:</span> poteto-mode<br><span class="lilac"># Non-negotiables</span><br><span class="lilac"># Principles</span><br><span class="lilac"># Autonomy</span><br><span class="lilac"># Subagents</span><br><span class="lilac"># Playbooks</span></pre></div><div class="fileaside">${s.cards.map(c=>`<div class="card fade"><div class="tag">${c.label}</div><h3>${c.title}</h3><p>${c.body}</p></div>`).join('')}</div>`;
 else if(s.kind==='route')h=`<div class="stack"><div class="prompt-bubble fade">“Use poteto-mode to add <span>OAuth for remote MCP servers</span> in Portage.”</div><div class="row">${node('INTENT','New capability')}<div class="arrow">→</div>${node('ROUTER','poteto-mode','purple')}<div class="arrow">→</div>${node('SELECTED PLAYBOOK','Feature','green')}</div><div class="captionlist"><span class="pill">Bug → Bug fix</span><span class="pill">Question → Investigation</span><span class="pill">Measured slowness → Perf issue</span></div></div>`;
 else if(s.kind==='design')h=`<div class="stack"><div class="alternative"><div class="card fade"><div class="tag">CANDIDATE A</div><h3>SDK-managed OAuth</h3><p>Evaluate existing capabilities and integration boundaries.</p></div><div class="card fade"><div class="tag">CANDIDATE B</div><h3>Application-managed OAuth</h3><p>Evaluate ownership, lifecycle, and maintenance costs.</p></div></div><div class="choice fade">architect + arena → compare → synthesize → verifiable implementation units</div><div class="micro">ILLUSTRATIVE ALTERNATIVES · NO DESIGN HAS BEEN SELECTED</div></div>`;
 else if(s.kind==='states')h=`<span class="label">CONCEPTUAL OAUTH EXAMPLE</span><div class="stack"><div class="row">${node('START','Disconnected')}<div class="arrow">→</div>${node('USER AUTHORIZES','Authorizing','purple')}<div class="arrow">→</div>${node('READY','Connected','green')}</div><div class="row">${node('TOKEN EXPIRES','Refreshing')}<div class="arrow">→</div>${node('RETRY OR REAUTHORIZE','Reconnect required','purple')}</div></div>`;
 else if(s.kind==='team')h=`<div class="flowcol" style="width:100%">${node('COORDINATOR','Own scope · integrate · verify','green')}<div class="stem"></div><div class="roles">${node('INVESTIGATOR','Understand the system')}${node('IMPLEMENTER','Build within a scope')}${node('REVIEWER','Challenge the result','purple')}</div><div class="micro">ILLUSTRATED ROLES · ACTUAL TOOLS AND MODELS DEPEND ON THE HOST</div></div>`;
 else if(s.kind==='audit')h=`<div class="audit fade"><div class="audit-row head"><span>ACTION</span><span>OBSERVABLE EVIDENCE</span><span>ASSESSMENT</span></div><div class="audit-row"><span>Investigate</span><span>Skill reads, code searches, history</span><span class="status">Traceable</span></div><div class="audit-row"><span>Implement</span><span>Scoped changes and review findings</span><span class="status">Reviewable</span></div><div class="audit-row"><span>Verify</span><span>Commands, events, screenshots, reports</span><span class="status">Reproducible</span></div><div class="audit-row"><span>Disclose</span><span>Unavailable capabilities and unresolved failures</span><span class="warn">Explicit</span></div></div>`;
 else if(s.kind==='prompt')h=`<div class="stack"><div class="prompt-bubble fade">“Use <span>poteto-mode</span> to add OAuth for remote MCP servers in Portage.<br>Prove an authenticated tool call succeeds. Keep credentials out of logs.<br><span>Let me review the design before implementation.</span>”</div><div class="captionlist"><span class="pill">Goal</span><span class="pill">Done check</span><span class="pill">Evidence</span><span class="pill">Constraints</span></div></div>`;
 else if(s.kind==='closing')h=`<div class="stack"><div class="row">${node('HUMAN','Direction')}<div class="arrow">→</div>${node('SKILL','Engineering playbook','purple')}<div class="arrow">→</div>${node('AGENT + TOOLS','Observable work','green')}</div><div class="source">Source · Lauren Tan’s <b>pstack / poteto-mode / SKILL.md</b><br>github.com/cursor/plugins/tree/main/pstack<br>Educational interpretation based on the installed version. OAuth examples are conceptual.</div></div>`;
 else h=cards(s);
 document.getElementById('stage').innerHTML=h;
};
